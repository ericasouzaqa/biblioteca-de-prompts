name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build portable executable
        shell: pwsh
        run: pyinstaller --clean --noconfirm --onefile --windowed --name BibliotecaDePrompts --icon=favicon.ico --add-data "assets/Fundo_Login_EricaQA_2912x2160.png;assets" --add-data "assets/Foto_Perfil_EricaQA_800x800.png;assets" app.py

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/BibliotecaDePrompts.exe -DestinationPath BibliotecaDePrompts-Windows.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BibliotecaDePrompts-Windows
          path: |
            BibliotecaDePrompts-Windows.zip
            dist/BibliotecaDePrompts.exe

      - name: Publish release asset for version tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" BibliotecaDePrompts-Windows.zip dist/BibliotecaDePrompts.exe --title "Biblioteca de Prompts ${GITHUB_REF_NAME}" --generate-notes
