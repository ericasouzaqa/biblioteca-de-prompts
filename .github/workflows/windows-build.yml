name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build executable
        shell: pwsh
        run: pyinstaller --onefile --windowed --name CentralDePrompts app.py

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/CentralDePrompts.exe -DestinationPath CentralDePrompts-Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CentralDePrompts-Windows
          path: CentralDePrompts-Windows.zip

      - name: Publish release asset for version tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" CentralDePrompts-Windows.zip --title "Central de Prompts ${GITHUB_REF_NAME}" --generate-notes
