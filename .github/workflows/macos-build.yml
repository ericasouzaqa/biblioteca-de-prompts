name: Build macOS
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-macos:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pillow
      - name: Build macOS app
        run: pyinstaller --clean --noconfirm --windowed --name BibliotecaDePrompts --add-data 'assets/Fundo_Login_EricaQA_2912x2160.png:assets' --add-data 'assets/Foto_Perfil_EricaQA_800x800.png:assets' app.py
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/BibliotecaDePrompts.app BibliotecaDePrompts-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BibliotecaDePrompts-macOS
          path: BibliotecaDePrompts-macOS.zip
      - name: Publish release asset for version tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in {1..20}; do
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" BibliotecaDePrompts-macOS.zip --clobber
              exit 0
            fi
            sleep 10
          done
          echo "Release ${GITHUB_REF_NAME} não ficou disponível a tempo" >&2
          exit 1
